name: build-native-ipa

# 只用手动触发：tools/push_via_api.py 是逐文件提交的，
# 若开放 push 触发，一次上传会排出几十个构建互相堵死队列。
on:
  workflow_dispatch:

concurrency:
  group: native-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译并打包未签名 IPA
        run: |
          chmod +x ./build_ipa.sh
          ./build_ipa.sh

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v5
        with:
          name: NavNative-unsigned-ipa
          path: build/NavNative-unsigned.ipa
          if-no-files-found: error
